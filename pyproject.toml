[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cebench"
version = "0.1.0"
description = "Code-Everything Bench: executable evidence for community-sourced generative development tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "momozi1996" }]
keywords = ["benchmark", "code generation", "agentic evaluation", "self-verification"]

# The core package deliberately has NO runtime dependencies: a fresh clone can
# be validated with the standard library alone. Everything below is optional.
[project.optional-dependencies]
browser = ["playwright>=1.44"]
yaml = ["PyYAML>=6.0"]
analysis = ["numpy>=1.26", "scipy>=1.12"]
dev = ["pytest>=8.0"]
full = ["cebench[browser,yaml,analysis,dev]"]

[project.scripts]
cebench = "cebench.cli:main"

[tool.setuptools.packages.find]
include = ["cebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
