<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karesansui — A Zen Sand Garden</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#14100c;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  #frame{
    position:absolute;inset:18px;
    border:10px solid #5b3f2a;
    border-radius:3px;
    box-shadow:
      inset 0 0 0 2px #3d2a1b,
      inset 0 0 18px rgba(0,0,0,.55),
      0 6px 24px rgba(0,0,0,.6);
    background:#e8e0cf;
    overflow:hidden;
  }
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block;}
  #bar{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:6px;z-index:5;
    background:rgba(20,14,8,.55);padding:7px 5px;border-radius:10px;
    backdrop-filter:blur(3px);
  }
  .tool{
    width:40px;height:40px;border:none;border-radius:8px;cursor:pointer;
    background:transparent;color:#e8e0cf;display:flex;align-items:center;justify-content:center;
    transition:background .18s;
  }
  .tool svg{width:22px;height:22px;stroke:#e8e0cf;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .tool:hover{background:rgba(232,224,207,.15);}
  .tool.active{background:rgba(232,224,207,.32);}
  .tool.on{color:#d9c98a;}
  .tool.on svg{stroke:#d9c98a;}
  .sep{height:1px;background:rgba(232,224,207,.25);margin:2px 4px;}
  #title{
    position:absolute;right:14px;top:14px;z-index:5;
    writing-mode:vertical-rl;
    font-family:Georgia,'Times New Roman',serif;
    color:#4a3a28;user-select:none;pointer-events:none;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  #title .kanji{font-size:30px;letter-spacing:.28em;font-weight:bold;}
  #title .latin{font-size:11px;letter-spacing:.32em;opacity:.75;margin-top:10px;font-style:italic;}
  #caption{
    position:absolute;left:64px;bottom:10px;z-index:5;
    font-family:Georgia,'Times New Roman',serif;font-size:11.5px;font-style:italic;
    color:#5c4a33;opacity:.85;user-select:none;pointer-events:none;
    letter-spacing:.04em;
  }
  #toast{
    position:absolute;left:50%;top:18px;transform:translateX(-50%);
    font-family:Georgia,serif;font-size:13px;color:#3d2f1e;
    background:rgba(232,224,207,.9);padding:6px 16px;border-radius:16px;
    opacity:0;transition:opacity .4s;pointer-events:none;z-index:9;
  }
  @media (max-width:600px){
    #frame{inset:10px;border-width:7px;}
    .tool{width:36px;height:36px;}
    #title .kanji{font-size:22px;}
    #caption{left:58px;font-size:10px;bottom:8px;}
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="bar">
    <button class="tool active" id="t-rake" title="Rake — drag to comb the sand" aria-label="Rake">
      <svg viewBox="0 0 24 24"><path d="M4 4v10M9 4v10M14 4v10M19 4v10M2 4h20"/><path d="M12 14v6"/></svg>
    </button>
    <button class="tool" id="t-ripple" title="Ripple — click near a stone" aria-label="Ripple">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity=".6"/><circle cx="12" cy="12" r="10.5" opacity=".35"/></svg>
    </button>
    <button class="tool" id="t-stone" title="Place stone — click to set" aria-label="Place stone">
      <svg viewBox="0 0 24 24"><path d="M6 17c-2.5 0-4-1.6-4-3.5S3.6 10 6 10c.4-2.8 2.8-5 5.8-5 3 0 5.4 2.1 5.9 4.9 2.4.2 4.3 1.7 4.3 3.6 0 2-1.8 3.5-4 3.5z" transform="translate(0,2) scale(.92)"/></svg>
    </button>
    <button class="tool" id="t-smooth" title="Smooth — drag to erase grooves" aria-label="Smooth">
      <svg viewBox="0 0 24 24"><path d="M3 14c3-3 6-3 9 0s6 3 9 0"/><path d="M3 8c3-3 6-3 9 0s6 3 9 0" opacity=".5"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tool" id="t-calm" title="Return to calm" aria-label="Return to calm">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="44 8"/><circle cx="12" cy="12" r="3.4"/></svg>
    </button>
    <button class="tool" id="t-chime" title="Wind chime (after first touch)" aria-label="Wind chime">
      <svg viewBox="0 0 24 24"><path d="M12 3v4M12 7l-4 5h8l-4-5zM12 12v3"/><circle cx="12" cy="18" r="2.2"/><path d="M17 5c1.5 1 1.5 3 0 4M7 5c-1.5 1-1.5 3 0 4" opacity=".5"/></svg>
    </button>
  </div>
  <div id="title"><span class="kanji">枯山水</span><span class="latin">Karesansui</span></div>
  <div id="caption">drag to rake &nbsp;·&nbsp; ripple around a stone &nbsp;·&nbsp; return to calm</div>
  <div id="toast"></div>
</div>
<script>
(function(){
"use strict";
const frame = document.getElementById('frame');
const cv = document.getElementById('cv');
const dctx = cv.getContext('2d');
const toast = document.getElementById('toast');
let DPR = Math.min(window.devicePixelRatio||1, 2);

// ---- internal resolution (sand shading is computed per-pixel here) ----
let S=1, iw=0, ih=0, cw=0, ch=0;
let base=null, height=null, outC=null, outCtx=null, outID=null, leafC=null, leafCtx=null;
let needsSand = true;

// ---- state ----
let stones=[], fallingLeaf=null, leafTimer=0;
let tool='rake', chimeOn=false, audio=null, master=null;
let calmT=0, dragging=false, lastP=null, lastDir=null;
let sunT = Math.random()*1000;

// ---------- build / resize ----------
function build(preserve){
  const r = frame.getBoundingClientRect();
  cw = Math.max(200, Math.round(r.width));
  ch = Math.max(200, Math.round(r.height));
  const old = preserve ? {iw,ih,height,base} : null;
  S = Math.min(1, Math.sqrt(1.25e6/(cw*ch)));
  iw = Math.round(cw*S); ih = Math.round(ch*S);
  cv.width = Math.round(cw*DPR); cv.height = Math.round(ch*DPR);
  const n = iw*ih;
  height = new Float32Array(n);
  if(old && old.height){
    const w=Math.min(iw,old.iw), h=Math.min(ih,old.ih);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)
      height[y*iw+x]=old.height[y*old.iw+x];
  }
  genBase();
  outC = document.createElement('canvas'); outC.width=iw; outC.height=ih;
  outCtx = outC.getContext('2d');
  outID = outCtx.createImageData(iw,ih);
  // opaque alpha
  const d=outID.data; for(let i=3;i<d.length;i+=4)d[i]=255;
  leafC = document.createElement('canvas'); leafC.width=iw; leafC.height=ih;
  leafCtx = leafC.getContext('2d');
  needsSand = true;
  if(old) return;
}
function genBase(){
  base = new Uint8ClampedArray(iw*ih*4);
  const R=232,G=224,B=207, n=iw*ih;
  // coarse blotch noise (value noise, 24px grid)
  const gx=Math.ceil(iw/24)+2, gy=Math.ceil(ih/24)+2;
  const grid=new Float32Array(gx*gy);
  for(let i=0;i<grid.length;i++)grid[i]=Math.random()*2-1;
  for(let y=0;y<ih;y++){
    const fy=y/24, y0=fy|0, ty=fy-y0;
    for(let x=0;x<iw;x++){
      const fx=x/24, x0=fx|0, tx=fx-x0;
      const i4=(y*iw+x)*4;
      const c00=grid[y0*gx+x0],c10=grid[y0*gx+x0+1],
            c01=grid[(y0+1)*gx+x0],c11=grid[(y0+1)*gx+x0+1];
      const coarse=(c00*(1-tx)+c10*tx)*(1-ty)+(c01*(1-tx)+c11*tx)*ty;
      const fine=(Math.random()*2-1)*5.5;
      const light = 1 - 0.06*((x/iw)*0.6+(y/ih)*0.4) + coarse*2.2;
      base[i4]  = R + fine + coarse*4 + (light-1)*40;
      base[i4+1]= G + fine + coarse*4 + (light-1)*40;
      base[i4+2]= B + fine*0.8 + coarse*3 + (light-1)*36;
    }
  }
}

// ---------- sand shading ----------
function renderSand(){
  const h=height, d=outID.data, b=base, n=iw*ih, K=0.42;
  d[3]=255;
  for(let y=1;y<ih-1;y++){
    const row=y*iw;
    for(let x=1;x<iw-1;x++){
      const i=row+x;
      const gx=h[i-1]-h[i+1], gy=h[i-iw]-h[i+iw];
      let l=1+(gx+gy)*K;
      if(l>1.5)l=1.5; else if(l<0.55)l=0.55;
      const j=i*4;
      d[j]  =b[j]*l;
      d[j+1]=b[j+1]*l;
      d[j+2]=b[j+2]*l;
    }
  }
  outCtx.putImageData(outID,0,0);
}

// ---------- brushes ----------
function stamp(cx,cy,rad,amt){
  cx|=0; cy|=0;
  const r=Math.ceil(rad), r2=rad*rad;
  const x0=Math.max(1,cx-r), x1=Math.min(iw-2,cx+r);
  const y0=Math.max(1,cy-r), y1=Math.min(ih-2,cy+r);
  for(let y=y0;y<=y1;y++){
    const dy=y-cy;
    for(let x=x0;x<=x1;x++){
      const dx=x-cx, d2=dx*dx+dy*dy;
      if(d2>r2)continue;
      const w=Math.exp(-d2/(r2*0.5));
      const i=y*iw+x;
      let v=height[i]+amt*w;
      if(v>2.4)v=2.4; else if(v<-2.4)v=-2.4;
      height[i]=v;
    }
  }
}
function smoothStamp(cx,cy,rad,str){
  cx|=0;cy|=0;
  const r=Math.ceil(rad), r2=rad*rad;
  const x0=Math.max(1,cx-r),x1=Math.min(iw-2,cx+r);
  const y0=Math.max(1,cy-r),y1=Math.min(ih-2,cy+r);
  for(let y=y0;y<=y1;y++){
    const dy=y-cy;
    for(let x=x0;x<=x1;x++){
      const dx=x-cx,d2=dx*dx+dy*dy;
      if(d2>r2)continue;
      const w=Math.exp(-d2/(r2*0.5))*str;
      const i=y*iw+x;
      height[i]+= (0-height[i])*w;
    }
  }
}
const TINES=5, TSPACE=13;
function rakeSegment(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0;
  const dist=Math.hypot(dx,dy);
  if(dist<0.8)return;
  const px=-dy/dist, py=dx/dist;
  const steps=Math.max(1,Math.ceil(dist/2));
  for(let s=0;s<=steps;s++){
    const t=s/steps, cx=x0+dx*t, cy=y0+dy*t;
    for(let k=0;k<TINES;k++){
      const off=(k-(TINES-1)/2)*TSPACE;
      stamp(cx+px*off, cy+py*off, 2.3, -0.55);                    // groove
      stamp(cx+px*(off-TSPACE*0.5), cy+py*(off-TSPACE*0.5), 2.6, 0.34); // ridge
      stamp(cx+px*(off+TSPACE*0.5), cy+py*(off+TSPACE*0.5), 2.6, 0.34);
    }
  }
  needsSand=true;
}
function ripple(cx,cy,r0,maxR){
  const A=0.85, freq=0.32;
  const x0=Math.max(1,cx-maxR|0),x1=Math.min(iw-2,cx+maxR|0);
  const y0=Math.max(1,cy-maxR|0),y1=Math.min(ih-2,cy+maxR|0);
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<r0||d>maxR)continue;
      const env=1-(d-r0)/(maxR-r0);
      height[y*iw+x]+= A*Math.sin((d-r0)*freq*6.28)*env*env;
    }
  }
  clampAll(); needsSand=true;
}
function clampAll(){
  for(let i=0;i<height.length;i++){
    const v=height[i];
    if(v>2.4)height[i]=2.4; else if(v<-2.4)height[i]=-2.4;
  }
}

// ---------- stones ----------
function makeStone(x,y,r){
  const n=11, pts=[];
  for(let i=0;i<n;i++)pts.push(0.72+Math.random()*0.5);
  const moss=[];
  const mc=1+(Math.random()*2|0);
  for(let m=0;m<mc;m++){
    moss.push({a:Math.random()*6.28, d:Math.random()*0.45, s:0.22+Math.random()*0.22});
  }
  return {x,y,r,pts,moss,rot:Math.random()*6.28};
}
function stonePts(st,scale){
  const n=st.pts.length, out=[];
  for(let i=0;i<n;i++){
    const a=st.rot + i*6.2832/n;
    out.push([st.x+Math.cos(a)*st.r*st.pts[i]*scale,
              st.y+Math.sin(a)*st.r*st.pts[i]*0.72*scale]);
  }
  return out;
}
function tracePath(ctx,pts){
  ctx.beginPath();
  const n=pts.length;
  ctx.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(let i=0;i<n;i++){
    const nx=pts[(i+1)%n];
    ctx.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+nx[0])/2,(pts[i][1]+nx[1])/2);
  }
  ctx.closePath();
}
function drawStone(ctx,st,sun){
  const shx=Math.cos(sun)*11, shy=4+Math.abs(Math.sin(sun))*8;
  // soft shadow
  ctx.save();
  ctx.filter='blur(5px)';
  ctx.globalAlpha=0.30;
  tracePath(ctx,stonePts(st,1.18).map(p=>[p[0]+shx,p[1]+shy*0.6]));
  ctx.fillStyle='#000'; ctx.fill();
  ctx.restore();
  // body
  const pts=stonePts(st,1);
  tracePath(ctx,pts);
  const g=ctx.createRadialGradient(st.x-st.r*0.4,st.y-st.r*0.5,st.r*0.15,st.x,st.y,st.r*1.25);
  g.addColorStop(0,'#a89f90'); g.addColorStop(0.55,'#7d7466'); g.addColorStop(1,'#4c453b');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(30,25,18,.4)'; ctx.lineWidth=1; ctx.stroke();
  // moss
  ctx.save();
  tracePath(ctx,pts); ctx.clip();
  for(const m of st.moss){
    const mx=st.x+Math.cos(m.a)*st.r*m.d, my=st.y+Math.sin(m.a)*st.r*m.d*0.72;
    ctx.globalAlpha=0.85;
    ctx.fillStyle='#6b7d4b';
    ctx.beginPath(); ctx.ellipse(mx,my,st.r*m.s,st.r*m.s*0.7,m.a,0,6.2832); ctx.fill();
    ctx.globalAlpha=0.5; ctx.fillStyle='#55663a';
    for(let k=0;k<4;k++){
      ctx.beginPath();
      ctx.arc(mx+(Math.random()-0.5)*st.r*m.s*1.6, my+(Math.random()-0.5)*st.r*m.s*1.2, 1.2+Math.random()*1.6, 0,6.2832);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ---------- leaves ----------
const LEAF_COLORS=['#b4552d','#c26b2e','#a8431f','#96682f'];
function leafPath(ctx,s){
  ctx.beginPath();
  for(let k=0;k<5;k++){
    const a1=k*1.2566-1.5708, a2=a1+0.6283;
    ctx.lineTo(Math.cos(a1)*s, Math.sin(a1)*s);
    ctx.lineTo(Math.cos(a2)*s*0.45, Math.sin(a2)*s*0.45);
  }
  ctx.closePath();
  ctx.moveTo(0,s*0.3); ctx.lineTo(0,s*1.5);
}
function spawnLeaf(){
  const x=Math.random()*iw;
  fallingLeaf={
    x, y:-14,
    tx: iw*0.15+Math.random()*iw*0.7,
    ty: ih*0.2+Math.random()*ih*0.65,
    vy:0.35+Math.random()*0.4, phase:Math.random()*6.28,
    rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.05,
    s:6+Math.random()*4,
    col:LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0]
  };
}
function drawLeafSprite(ctx,l,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(l.x,l.y); ctx.rotate(l.rot);
  ctx.fillStyle=l.col;
  leafPath(ctx,l.s); ctx.fill();
  ctx.strokeStyle='rgba(60,30,10,.5)'; ctx.lineWidth=0.8; ctx.stroke();
  ctx.restore();
}

// ---------- wind chime ----------
function ensureAudio(){
  if(audio)return;
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    master=audio.createGain(); master.gain.value=0.55; master.connect(audio.destination);
  }catch(e){audio=null;}
}
function chimeNote(delay){
  if(!audio)return;
  const t=audio.currentTime+delay;
  const f=[392,440,523.25,587.33,659.25][(Math.random()*5)|0]*(Math.random()<0.3?0.5:1);
  [[1,1],[2.01,0.35],[2.76,0.22],[5.4,0.07]].forEach(p=>{
    const o=audio.createOscillator(), g=audio.createGain();
    o.type='sine'; o.frequency.value=f*p[0];
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.05*p[1],t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2.2+Math.random());
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+4);
  });
}
setInterval(()=>{
  if(!chimeOn||!audio)return;
  if(Math.random()<0.3){
    const n=1+(Math.random()*3|0);
    for(let i=0;i<n;i++)chimeNote(i*(0.35+Math.random()*0.5));
  }
},9000);

// ---------- UI ----------
const btns={rake:document.getElementById('t-rake'),ripple:document.getElementById('t-ripple'),
  stone:document.getElementById('t-stone'),smooth:document.getElementById('t-smooth')};
function setTool(t){tool=t;
  for(const k in btns)btns[k].classList.toggle('active',k===t);
  cv.style.cursor = t==='stone'||t==='ripple' ? 'pointer':'crosshair';
}
btns.rake.onclick=()=>setTool('rake');
btns.ripple.onclick=()=>setTool('ripple');
btns.stone.onclick=()=>setTool('stone');
btns.smooth.onclick=()=>setTool('smooth');
document.getElementById('t-calm').onclick=()=>{
  calmT=1; showToast('returning to calm\u2026');
};
const chimeBtn=document.getElementById('t-chime');
chimeBtn.onclick=()=>{
  ensureAudio();
  if(audio&&audio.state==='suspended')audio.resume();
  chimeOn=!chimeOn;
  chimeBtn.classList.toggle('on',chimeOn);
  if(chimeOn)chimeNote(0);
};
let toastTimer=null;
function showToast(msg){
  toast.textContent=msg; toast.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.style.opacity=0,1600);
}

// ---------- pointer ----------
function toLocal(e){
  const r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*S,(e.clientY-r.top)*S];
}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(audio&&audio.state==='suspended')audio.resume();
  cv.setPointerCapture(e.pointerId);
  dragging=true;
  const [x,y]=toLocal(e);
  lastP=[x,y]; lastDir=null;
  if(tool==='ripple'){
    let best=null,bd=1e9;
    for(const st of stones){
      const d=Math.hypot(st.x-x,st.y-y);
      if(d<bd){bd=d;best=st;}
    }
    const c=(best&&bd<160*S)?best:{x,y,r:6};
    const maxR=Math.min(120*S, Math.min(c.x,iw-c.x,c.y,ih-c.y)-4);
    ripple(c.x|0,c.y|0,(c.r+5),Math.max(30,maxR));
    dragging=false;
  }else if(tool==='stone'){
    if(x>20*S&&y>20*S&&x<iw-20*S&&y<ih-20*S){
      stones.push(makeStone(x,y,(20+Math.random()*22)*Math.max(S,0.7)));
      showToast('a stone settles');
    }
    dragging=false;
  }
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const [x,y]=toLocal(e);
  const [lx,ly]=lastP;
  if(tool==='rake'){
    rakeSegment(lx,ly,x,y);
    lastDir=[x-lx,y-ly];
  }else if(tool==='smooth'){
    const dist=Math.hypot(x-lx,y-ly);
    const steps=Math.max(1,Math.ceil(dist/4));
    for(let s=0;s<=steps;s++){
      const t=s/steps;
      smoothStamp(lx+(x-lx)*t, ly+(y-ly)*t, 20*S, 0.22);
    }
    needsSand=true;
  }
  lastP=[x,y];
  e.preventDefault();
});
function endDrag(){dragging=false;}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

// ---------- initial garden ----------
function initGarden(){
  stones=[];
  const w=iw,h=ih;
  stones.push(makeStone(w*0.62,h*0.38,Math.min(w,h)*0.055));
  stones.push(makeStone(w*0.30,h*0.66,Math.min(w,h)*0.040));
  stones.push(makeStone(w*0.78,h*0.74,Math.min(w,h)*0.030));
  for(const st of stones){
    const maxR=Math.min(110*S, Math.min(st.x,iw-st.x,st.y,ih-st.y)-4);
    ripple(st.x|0,st.y|0,st.r+5,Math.max(40,maxR));
  }
  needsSand=true;
}

// ---------- resize ----------
let rzTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(rzTimer);
  rzTimer=setTimeout(()=>{build(true);},250);
});

// ---------- main loop ----------
let lastFrame=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(50,t-lastFrame); lastFrame=t;
  sunT += dt/1000;

  // return to calm animation
  if(calmT>0){
    const n=height.length;
    let mx=0;
    for(let i=0;i<n;i++){
      height[i]*=0.925;
      const a=Math.abs(height[i]); if(a>mx)mx=a;
    }
    needsSand=true;
    if(mx<0.02)calmT=0;
  }

  if(needsSand){renderSand(); needsSand=false;}

  // falling leaf
  leafTimer-=dt;
  if(!fallingLeaf && leafTimer<=0){
    spawnLeaf();
    leafTimer=9000+Math.random()*11000;
  }
  if(fallingLeaf){
    const l=fallingLeaf;
    l.phase+=dt*0.004;
    l.x += Math.sin(l.phase)*0.9 + (l.tx-l.x)*0.004;
    l.y += l.vy*dt/16;
    l.rot += l.vr*dt/16 + Math.sin(l.phase)*0.02;
    if(l.y>=l.ty || l.x<4||l.x>iw-4){
      leafCtx.save();
      leafCtx.globalAlpha=0.25; leafCtx.translate(l.x+3,l.y+2);
      leafCtx.fillStyle='#000'; leafCtx.beginPath();
      leafCtx.ellipse(0,0,l.s*1.2,l.s*0.5,0,0,6.2832); leafCtx.fill();
      leafCtx.restore();
      drawLeafSprite(leafCtx,l,0.92);
      fallingLeaf=null;
    }
  }

  // ---- composite to display ----
  dctx.setTransform(DPR,0,0,DPR,0,0);
  dctx.clearRect(0,0,cw,ch);
  dctx.imageSmoothingEnabled=true;
  dctx.drawImage(outC,0,0,iw,ih,0,0,cw,ch);
  dctx.drawImage(leafC,0,0,iw,ih,0,0,cw,ch);
  const sun=sunT*0.35;
  for(const st of stones)drawStone(dctx,st,sun);
  if(fallingLeaf)drawLeafSprite(dctx,fallingLeaf,0.95);
}

// ---------- boot ----------
build(false);
initGarden();
leafTimer=4000;
requestAnimationFrame(loop);
})();
</script>
