<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>桜谷 · 樱花山谷</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#101623;font-family:"Noto Serif SC","Songti SC",serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* ---------- loading ---------- */
  #loader{position:fixed;inset:0;background:#141a28;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#d8c9d4;transition:opacity .8s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .t{font-size:26px;letter-spacing:.4em;text-indent:.4em;margin-bottom:18px}
  #loader .bar{width:180px;height:2px;background:#2a3247;overflow:hidden;border-radius:2px}
  #loader .bar i{display:block;height:100%;width:40%;background:#e8a7bd;animation:ld 1.1s infinite ease-in-out}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
  #loader .err{margin-top:16px;font-size:13px;color:#e8a0a0;max-width:80%;text-align:center;line-height:1.7}
  /* ---------- UI ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .4s}
  #ui.hidden{opacity:0}
  #ui.hidden .peak{pointer-events:none!important}
  #title{position:absolute;top:22px;left:26px;color:#f3e9ee;pointer-events:none;
    text-shadow:0 2px 12px rgba(10,15,30,.7)}
  #title h1{font-size:24px;font-weight:600;letter-spacing:.28em}
  #title p{font-size:11px;letter-spacing:.35em;opacity:.75;margin-top:6px}
  #panel{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:8px;align-items:center;max-width:96vw}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
  .peak{border:1px solid rgba(240,225,235,.28);background:rgba(16,20,34,.55);color:#e9dfe7;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:7px 14px;font-size:12px;letter-spacing:.12em;border-radius:3px;cursor:pointer;
    font-family:inherit;transition:all .25s;white-space:nowrap}
  .peak:hover{background:rgba(60,45,60,.7);border-color:rgba(240,200,215,.6)}
  .peak.on{background:rgba(232,167,189,.85);color:#2a1620;border-color:transparent}
  #hint{position:absolute;right:22px;bottom:20px;color:rgba(240,230,238,.55);font-size:11px;
    letter-spacing:.15em;pointer-events:none;text-align:right;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #restore{position:fixed;top:16px;right:16px;z-index:11;display:none}
  #toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:20;
    background:rgba(20,24,40,.8);color:#f0e4ec;padding:8px 18px;border-radius:3px;font-size:13px;
    letter-spacing:.1em;opacity:0;transition:opacity .4s;pointer-events:none}
  @media (max-width:640px){
    #title h1{font-size:18px}#title p{font-size:9px}
    .peak{padding:6px 10px;font-size:11px}
    #hint{display:none}
    #panel{bottom:10px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="loader"><div class="t">桜 谷</div><div class="bar"><i></i></div><div class="err" id="loadErr"></div></div>
<div id="ui">
  <div id="title"><h1>桜谷 · 樱花山谷</h1><p>SAKURA VALLEY — 蓝调时刻</p></div>
  <div id="panel">
    <div class="row" id="views">
      <button class="peak on" data-v="0">山谷全景</button>
      <button class="peak" data-v="1">河边低机位</button>
      <button class="peak" data-v="2">寺庙小径</button>
      <button class="peak" data-v="3">山坡俯瞰</button>
    </div>
    <div class="row" id="tools">
      <button class="peak on" data-m="dusk">蓝调时刻</button>
      <button class="peak" data-m="dawn">清晨</button>
      <button class="peak" data-m="rain">雨中</button>
      <button class="peak" id="bTour">巡游</button>
      <button class="peak" id="bSound">环境音</button>
      <button class="peak" id="bQual">轻量模式</button>
      <button class="peak" id="bReset">重置视角</button>
      <button class="peak" id="bShot">保存画面</button>
      <button class="peak" id="bHide">隐藏界面</button>
    </div>
  </div>
  <div id="hint">拖动环视 · 滚轮缩放 · 双指缩放</div>
</div>
<button class="peak" id="restore">显示界面</button>
<div id="toast"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

/* ================= 基础 ================= */
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 700;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let quality = isMobile ? 'light' : 'high';

const app = document.getElementById('app');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
}catch(e){
  document.getElementById('loadErr').textContent = '当前浏览器不支持 WebGL，无法渲染 3D 景观。';
  throw e;
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.5, 1200);
camera.position.set(0,42,150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 8; controls.maxDistance = 320;
controls.target.set(0,6,-30);

/* ================= 地形 ================= */
const WATER = 0;
function riverX(z){ return 14*Math.sin(z*0.02)+6*Math.sin(z*0.045+1.7); }
function heightAt(x,z){
  const d = Math.abs(x-riverX(z));
  let h = 2.5 + Math.pow(Math.max(0,d-6),1.5)*0.045;
  h += Math.sin(x*0.05)*0.55 + Math.sin(z*0.04+x*0.03)*0.7 + Math.sin(x*0.13+z*0.11)*0.35;
  const hd = Math.hypot(x+55, z+70);                 // 西侧寺庙山丘
  h += Math.max(0, 1-hd/55)*14;
  const hv = Math.hypot(x-70, z-95);                 // 东侧矮丘
  h += Math.max(0, 1-hv/45)*6;
  if(z<-140) h += (-140-z)*0.30;                     // 远端抬升
  if(z> 130) h += (z-130)*0.22;
  const t = Math.max(0, 1-d/10); h -= t*t*7;         // 河道下切
  return h;
}
function buildTerrain(){
  const cell = 3, N = 100, Z0=-255, Z1=165;
  const nz = Math.round((Z1-Z0)/cell);
  const count = (N+1)*(nz+1);
  const geo = new THREE.BoxGeometry(cell,1,cell);
  const mat = new THREE.MeshLambertMaterial();
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  let i=0;
  const rnd = mulberry(7);
  for(let iz=0; iz<=nz; iz++) for(let ix=0; ix<=N; ix++){
    const x = -150+ix*cell, z = Z0+iz*cell;
    const h = heightAt(x,z);
    const top = Math.max(h, WATER-2.2);
    const base = WATER-3.2;
    m.makeScale(1, Math.max(0.4, top-base), 1);
    m.setPosition(x, (top+base)/2, z);
    mesh.setMatrixAt(i, m);
    // 颜色
    const d = Math.abs(x-riverX(z));
    const n = rnd()*0.12;
    if(top < WATER+0.7)      c.setRGB(0.16+n,0.16+n,0.17+n);          // 湿石
    else if(top < WATER+1.9) c.setRGB(0.42+n,0.37+n,0.30+n);          // 岸沙
    else if(top > 17)        c.setRGB(0.34+n,0.36+n,0.40+n);          // 高处岩石
    else{
      const g = 0.30+Math.min(0.18,top*0.012)+n*0.6;
      c.setRGB(0.16+n*0.5, g, 0.20+n*0.4);                            // 草地
      if(d<14) c.setRGB(0.30+n,0.34+n,0.22+n);                        // 河岸草
    }
    mesh.setColorAt(i,c); i++;
  }
  mesh.receiveShadow = true; mesh.castShadow = false;
  scene.add(mesh);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= 水面 ================= */
let water, rippleMesh, rippleGeo;
function buildWater(){
  water = new Reflector(new THREE.PlaneGeometry(330,470),{
    textureWidth: quality==='high'?1024:256,
    textureHeight: quality==='high'?1024:256,
    color: 0x5a6a78, clipBias: 0.003
  });
  water.rotation.x = -Math.PI/2; water.position.set(0, WATER-0.02, -40);
  scene.add(water);
  // 波纹层
  rippleGeo = new THREE.PlaneGeometry(330,470, 44, 60);
  rippleMesh = new THREE.Mesh(rippleGeo, new THREE.MeshPhongMaterial({
    color:0x2e4a5c, transparent:true, opacity:0.28, shininess:90,
    specular:0x9db8cc, depthWrite:false
  }));
  rippleMesh.rotation.x = -Math.PI/2; rippleMesh.position.set(0, WATER+0.06, -40);
  scene.add(rippleMesh);
}
const _rp = ripplePos => {};
function animWater(t){
  if(!rippleGeo) return;
  const p = rippleGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i);
    p.setZ(i, Math.sin(x*0.12+t*1.1)*0.14 + Math.sin(y*0.09-t*0.8)*0.12);
  }
  p.needsUpdate = true;
}

/* ================= 樱花古树 ================= */
function buildCherryTree(x,z){
  const g = new THREE.Group();
  const base = heightAt(x,z);
  g.position.set(x, base-0.5, z);
  const bark = new THREE.MeshLambertMaterial({color:0x4a3a36});
  const tips = [];
  const q = new THREE.Quaternion(), up = new THREE.Vector3(0,1,0);
  function branch(pos, dir, len, thick, depth){
    const end = pos.clone().addScaledVector(dir, len);
    const mid = pos.clone().addScaledVector(dir, len/2);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(thick, len, thick), bark);
    mesh.position.copy(mid);
    q.setFromUnitVectors(up, dir.clone().normalize());
    mesh.quaternion.copy(q);
    mesh.castShadow = true;
    g.add(mesh);
    if(depth>=4 || len<2.2){ tips.push({p:end, r:thick}); return; }
    const n = depth<1 ? 3 : 2;
    for(let i=0;i<n;i++){
      const nd = dir.clone();
      nd.x += (Math.random()-0.5)*1.1; nd.z += (Math.random()-0.5)*1.1;
      nd.y = Math.abs(nd.y)*0.75 + 0.35;
      nd.normalize();
      branch(end, nd, len*(0.62+Math.random()*0.15), thick*0.62, depth+1);
    }
  }
  branch(new THREE.Vector3(0,0,0), new THREE.Vector3(0.12,1,0.05), 9, 2.4, 0);
  branch(new THREE.Vector3(0.8,7.5,0.4), new THREE.Vector3(-0.55,0.8,-0.2), 6.5, 1.4, 2);
  // 花簇
  const blossomGeo = new THREE.BoxGeometry(1,1,1);
  const bMat = new THREE.MeshLambertMaterial();
  const total = tips.length*14;
  const bMesh = new THREE.InstancedMesh(blossomGeo, bMat, total);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  const palette = [0xf6c6d8,0xf2a7c0,0xfadce6,0xe890b0,0xfbd0de];
  let i=0;
  const qq = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random(),Math.random(),Math.random()));
  for(const t of tips){
    const n = 10+Math.floor(Math.random()*6);
    for(let k=0;k<n && i<total;k++){
      const r = 2.2+Math.random()*2.4;
      const s = 0.9+Math.random()*1.6;
      m.compose(
        new THREE.Vector3(t.p.x+(Math.random()-0.5)*r*2, t.p.y+(Math.random()-0.3)*r*1.4, t.p.z+(Math.random()-0.5)*r*2),
        qq, new THREE.Vector3(s,s*0.7,s));
      bMesh.setMatrixAt(i,m);
      c.setHex(palette[Math.floor(Math.random()*palette.length)]);
      bMesh.setColorAt(i,c); i++;
    }
  }
  bMesh.count = i; bMesh.castShadow = true;
  g.add(bMesh);
  // 根部
  for(let k=0;k<5;k++){
    const r = new THREE.Mesh(new THREE.BoxGeometry(1.4,1.2,1.4), bark);
    const a = Math.random()*Math.PI*2;
    r.position.set(Math.cos(a)*2.2, 0.2, Math.sin(a)*2.2);
    r.rotation.y = a; r.scale.set(1.6,0.5,1); g.add(r);
  }
  scene.add(g);
}

/* ================= 建筑 ================= */
const woodDark = new THREE.MeshLambertMaterial({color:0x3d2f2a});
const woodRed  = new THREE.MeshLambertMaterial({color:0x8e3b32});
const woodWarm = new THREE.MeshLambertMaterial({color:0x5a4034});
const roofMat  = new THREE.MeshLambertMaterial({color:0x2e3440});
const roofMat2 = new THREE.MeshLambertMaterial({color:0x3a3f4c});
const winMat   = new THREE.MeshBasicMaterial({color:0xffc984});
function box(w,h,d,mat,x,y,z,parent,shadow=true){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  b.position.set(x,y,z); b.castShadow = shadow; b.receiveShadow = true;
  parent.add(b); return b;
}
function makeHouse(w,d,h,roof,wall){
  const g = new THREE.Group();
  box(w,h,d, wall||woodWarm, 0,h/2,0, g);
  box(w*0.94,0.5,d*0.94, woodDark, 0,h+0.2,0, g);       // 檐下梁
  // 层叠屋顶
  let rw = w*1.35, rd = d*1.35, ry = h+0.4, rh = 1.4;
  for(let t=0;t<3;t++){
    box(rw, rh, rd, roof||roofMat, 0, ry+rh/2, 0, g);
    ry += rh; rw *= 0.78; rd *= 0.78; rh *= 0.85;
  }
  box(w*0.4,0.9,w*0.4, roof||roofMat, 0, ry+0.4, 0, g); // 顶脊
  // 窗与门（暖光）
  const wn = Math.max(1,Math.floor(w/3));
  for(let k=0;k<wn;k++){
    const wx = -w/2+ (k+0.5)*(w/wn);
    box(1.1,1.3,0.15, winMat, wx, h*0.55, d/2+0.05, g, false);
    box(1.1,1.3,0.15, winMat, wx, h*0.55, -d/2-0.05, g, false);
  }
  box(1.4,2.2,0.15, woodDark, 0, 1.1, d/2+0.06, g, false);
  return g;
}
function makePagoda(){
  const g = new THREE.Group();
  let w = 9, y = 0;
  box(10,2,10, new THREE.MeshLambertMaterial({color:0x555a60}), 0,1,0, g); // 石台
  y = 2;
  for(let t=0;t<5;t++){
    const bh = 3.2-t*0.3;
    box(w*0.72, bh, w*0.72, woodRed, 0, y+bh/2, 0, g);
    box(w*0.72,0.4,w*0.72, woodDark, 0, y+bh+0.1, 0, g);
    box(w*1.25, 1.1, w*1.25, roofMat2, 0, y+bh+0.75, 0, g);
    if(t<4) box(0.9,0.9,0.9, winMat, 0, y+bh*0.5, w*0.365, g, false);
    y += bh+1.3; w *= 0.82;
  }
  box(0.8,2.4,0.8, new THREE.MeshLambertMaterial({color:0xc9a848}), 0, y+1.2, 0, g);
  return g;
}
function makeTorii(){
  const g = new THREE.Group();
  box(1.2,7,1.2, woodRed, -3.4,3.5,0, g);
  box(1.2,7,1.2, woodRed,  3.4,3.5,0, g);
  box(9.6,0.9,1.4, woodRed, 0,7.2,0, g);
  box(7.6,0.7,1.1, woodRed, 0,5.9,0, g);
  return g;
}
function makeLantern(withLight){
  const g = new THREE.Group();
  const stone = new THREE.MeshLambertMaterial({color:0x8a8d92});
  box(1.3,0.5,1.3, stone, 0,0.25,0, g);
  box(0.6,1.8,0.6, stone, 0,1.4,0, g);
  box(1.1,0.9,1.1, withLight?winMat:stone, 0,2.7,0, g, false);
  box(1.6,0.4,1.6, stone, 0,3.35,0, g);
  if(withLight){
    const pl = new THREE.PointLight(0xffb066, 14, 22, 2);
    pl.position.set(0,2.7,0); g.add(pl); lanternLights.push(pl);
  }
  return g;
}
const lanternLights = [];
function placeOnTerrain(obj,x,z,sink=0.4){
  obj.position.set(x, heightAt(x,z)-sink, z);
  scene.add(obj);
}
function buildVillage(){
  // 民居（不同体量）
  const specs = [
    [26,16, 5,4.2, roofMat, woodWarm],[36,32, 6.5,4.6, roofMat2, woodWarm],
    [19,44, 4.5,3.8, roofMat, woodDark],[42,6, 5.5,4.4, roofMat2, woodWarm],
    [30,58, 4.2,3.6, roofMat, woodWarm],[48,20, 7,5.2, roofMat, woodWarm] // 茶屋
  ];
  for(const [x,z,w,h,rf,wd] of specs){
    const hs = makeHouse(w, w*0.8, h, rf, wd);
    placeOnTerrain(hs, x, z);
  }
  // 神社 + 鸟居
  const shrine = makeHouse(6,6,4.5, roofMat2, woodRed);
  placeOnTerrain(shrine, -30, -8);
  const torii = makeTorii();
  placeOnTerrain(torii, -22, 2);
  // 五重塔
  const pg = makePagoda();
  placeOnTerrain(pg, -55, -70, 0.2);
  // 石灯笼
  const spots = [[16,24,true],[-14,34,false],[22,46,true],[-19,10,false],[-24,66,true],[36,40,false]];
  for(const [x,z,l] of spots) placeOnTerrain(makeLantern(l), x, z);
  // 红桥
  const bridge = new THREE.Group();
  const zB = 30, cx = riverX(zB), span = 13;
  for(let k=-10;k<=10;k++){
    const t = k/10, xx = cx + t*span;
    const y = WATER + 2.2 + (1-t*t)*2.0;
    box(1.5,0.5,4.6, woodRed, xx, y, zB, bridge);
    if(k%2===0){
      box(0.35,1.6,0.35, woodDark, xx, y+1.0, zB-2.1, bridge);
      box(0.35,1.6,0.35, woodDark, xx, y+1.0, zB+2.1, bridge);
    }
  }
  box(span*2+3,0.35,0.5, woodDark, cx, WATER+4.6, zB-2.1, bridge);
  box(span*2+3,0.35,0.5, woodDark, cx, WATER+4.6, zB+2.1, bridge);
  scene.add(bridge);
  // 小径石板
  const pathMat = new THREE.MeshLambertMaterial({color:0x9a948c});
  const rnd = mulberry(31);
  function path(x1,z1,x2,z2,n){
    for(let k=0;k<=n;k++){
      const t=k/n, jx=(rnd()-0.5)*2, jz=(rnd()-0.5)*2;
      const x=x1+(x2-x1)*t+jx, z=z1+(z2-z1)*t+jz;
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.3,1.3), pathMat);
      b.position.set(x, heightAt(x,z)+0.05, z);
      b.rotation.y = rnd()*3; b.receiveShadow = true;
      scene.add(b);
    }
  }
  path(cx+span, zB, 26, 18, 14); path(26,18, 36, 32, 12);
  path(26,18, 19, 44, 10); path(cx-span, zB, -22, 2, 14); path(-22,2, -30,-8, 6);
  path(26,18, 48, 22, 10);
}

/* ================= 树林 / 岩石 / 远山 ================= */
function buildForest(){
  const rnd = mulberry(99);
  const trunkGeo = new THREE.BoxGeometry(1,1,1);
  const trunkMat = new THREE.MeshLambertMaterial({color:0x46352e});
  const leafGeo = new THREE.BoxGeometry(1,1,1);
  const leafMat = new THREE.MeshLambertMaterial();
  const trunks=[], leaves=[];
  const spots = [];
  // 避开建筑与河流
  const clear = [[26,16,10],[36,32,11],[19,44,9],[42,6,10],[30,58,9],[48,20,12],
                 [-30,-8,9],[-22,2,8],[-55,-70,12],[-26,78,16],[16,24,4],[36,40,5]];
  let tries=0;
  while(spots.length<240 && tries<3000){
    tries++;
    const x = -150+rnd()*300, z = -250+rnd()*400;
    const d = Math.abs(x-riverX(z));
    if(d<11) continue;
    let bad=false;
    for(const [cx,cz,r] of clear) if(Math.hypot(x-cx,z-cz)<r){bad=true;break;}
    if(bad) continue;
    const h = heightAt(x,z);
    if(h<1.6) continue;
    spots.push([x,z,h,rnd()]);
  }
  spots.sort((a,b)=>b[2]-a[2]);
  for(const [x,z,h,r] of spots){
    const far = Math.min(1, Math.max(0, (-z-60)/180)); // 距离因子
    const th = 3+r*3, tw = 0.7+r*0.7;
    trunks.push({x, y:h+th/2-0.4, z, sx:tw, sy:th, sz:tw});
    const ln = 2+Math.floor(r*2);
    for(let k=0;k<ln;k++){
      const s = 2.4+r*2.2 - far*0.5;
      leaves.push({x:x+(rnd()-0.5)*1.6, y:h+th+ (k*1.2) -0.4, z:z+(rnd()-0.5)*1.6,
        sx:s*(0.8+rnd()*0.4), sy:s*0.75, sz:s*(0.8+rnd()*0.4), far, r:rnd()});
    }
  }
  const tMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, trunks.length);
  const lMesh = new THREE.InstancedMesh(leafGeo, leafMat, leaves.length);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  trunks.forEach((t,i)=>{
    m.makeScale(t.sx,t.sy,t.sz); m.setPosition(t.x,t.y,t.z);
    tMesh.setMatrixAt(i,m);
  });
  leaves.forEach((l,i)=>{
    m.makeScale(l.sx,l.sy,l.sz); m.setPosition(l.x,l.y,l.z);
    lMesh.setMatrixAt(i,m);
    // 空气透视：远处偏冷偏灰
    const base = l.r;
    const g = 0.20+base*0.14, rr = 0.14+base*0.10, bb = 0.18+base*0.10;
    const f = l.far;
    c.setRGB(rr*(1-f)+0.30*f, g*(1-f)+0.36*f, bb*(1-f)+0.44*f);
    lMesh.setColorAt(i,c);
  });
  tMesh.castShadow = true; lMesh.castShadow = true; lMesh.receiveShadow = true;
  scene.add(tMesh, lMesh);
  // 岩石与草丛
  const rockMat = new THREE.MeshLambertMaterial({color:0x6a6d72});
  const rockMesh = new THREE.InstancedMesh(rockGeo=new THREE.BoxGeometry(1,1,1), rockMat, 90);
  const grassMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
    new THREE.MeshLambertMaterial({color:0x3f5a30}), 260);
  let ri=0, gi=0;
  for(let k=0;k<400;k++){
    const x=-150+rnd()*300, z=-250+rnd()*400;
    const d=Math.abs(x-riverX(z)); const h=heightAt(x,z);
    if(h<0.8) continue;
    if(d<13 && ri<90 && rnd()<0.6){ // 河边湿石
      m.makeScale(1+rnd()*2, 0.8+rnd()*1.2, 1+rnd()*1.6);
      m.setPosition(x, h+0.2, z); rockMesh.setMatrixAt(ri++, m);
    } else if(gi<260){
      m.makeScale(0.5+rnd()*0.7, 0.7+rnd()*1.1, 0.5+rnd()*0.7);
      m.setPosition(x, h+0.4, z); grassMesh.setMatrixAt(gi++, m);
    }
  }
  rockMesh.count=ri; grassMesh.count=gi;
  rockMesh.castShadow = true;
  scene.add(rockMesh, grassMesh);
}

function animExtras(t, dt){
  for(const k of koi){
    const u = k.userData; u.a += u.s*dt;
    k.position.x = u.cx + Math.cos(u.a)*u.r;
    k.position.z = u.cz + Math.sin(u.a)*u.r*0.6;
    k.rotation.y = -u.a + Math.PI/2;
  }
  if(fireflies.visible){
    const p = fireflies.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      p.setY(i, 3+Math.sin(t*1.3+i)*1.6+Math.sin(t*0.4+i*2.7)*1.2);
      p.setX(i, p.getX(i)+Math.sin(t*0.5+i)*0.01);
    }
    p.needsUpdate = true;
    fireflies.material.opacity = 0.5+Math.sin(t*3)*0.35;
  }
  if(petals.visible && !reduceMotion){
    const mm = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    const s = new THREE.Vector3(1,1,1);
    petals.userData.data.forEach((d,i)=>{
      d.y -= d.v*0.016*60*dt*0.35; d.ph += dt*2;
      if(d.y<1){ d.y = 40+Math.random()*15; d.x=-70+Math.random()*160; d.z=-60+Math.random()*160; }
      e.set(t*1.5+d.ph, d.ph, t+d.ph); q.setFromEuler(e);
      mm.compose(new THREE.Vector3(d.x+Math.sin(d.ph)*2.5, d.y, d.z+Math.cos(d.ph*0.7)*2), q, s);
      petals.setMatrixAt(i, mm);
    });
    petals.instanceMatrix.needsUpdate = true;
  }
  if(rain.visible){
    const p = rain.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      let y = p.getY(i) - dt*38;
      if(y<0) y = 55+Math.random()*10;
      p.setY(i,y);
    }
    p.needsUpdate = true;
  }
  for(const b of birds){
    b.position.x += b.userData.v*dt;
    if(b.position.x>110) b.position.x = -110;
    b.scale.y = 1+Math.sin(t*7+b.userData.ph)*0.9;
  }
}

const VIEWS = [
  {p:[2,40,148], t:[0,6,-40]},     // 山谷全景
  {p:[16,3.2,58], t:[-2,4.5,-20]}, // 河边低机位
  {p:[-24,9,16],  t:[-52,16,-66]}, // 寺庙小径
  {p:[78,58,86],  t:[-15,0,-45]}   // 山坡俯瞰
];
let tween = null, tour = false;
function goView(i, instant){
  const v = VIEWS[i];
  document.querySelectorAll('#views .peak').forEach((b,k)=>b.classList.toggle('on',k===i));
  if(instant){
    camera.position.set(...v.p); controls.target.set(...v.t); controls.update(); return;
  }
  tween = {t:0, p0:camera.position.clone(), t0:controls.target.clone(),
           p1:new THREE.Vector3(...v.p), t1:new THREE.Vector3(...v.t)};
}
function animTween(dt){
  if(tween){
    tween.t += dt/1.8;
    const k = tween.t>=1 ? 1 : (tween.t<0.5 ? 4*tween.t**3 : 1-Math.pow(-2*tween.t+2,3)/2);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if(tween.t>=1) tween=null;
  } else if(tour && !reduceMotion){
    const a = performance.now()*0.00006;
    const r = 120;
    camera.position.set(Math.sin(a)*r, 42+Math.sin(a*0.7)*10, 40+Math.cos(a)*r);
    controls.target.set(0,6,-30);
  }
}

/* ================= 声音（默认关闭） ================= */
let audioOn = false, audioCtx = null, bellTimer = null;
function toggleSound(){
  if(!audioOn){
    if(!audioCtx){
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      // 风：过滤噪声
      const len = audioCtx.sampleRate*3;
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*0.4;
      const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
      const g = audioCtx.createGain(); g.gain.value = 0.05;
      src.connect(lp).connect(g).connect(audioCtx.destination); src.start();
      bellTimer = setInterval(()=>{
        if(!audioOn) return;
        const o = audioCtx.createOscillator(), og = audioCtx.createGain();
        o.frequency.value = 660+Math.random()*440; o.type='sine';
        og.gain.setValueAtTime(0.06, audioCtx.currentTime);
        og.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+2.5);
        o.connect(og).connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime+2.6);
      }, 7000+Math.random()*5000);
    }
    audioCtx.resume(); audioOn = true;
  } else {
    audioCtx.suspend(); audioOn = false;
  }
  document.getElementById('bSound').classList.toggle('on', audioOn);
  toast(audioOn?'环境音已开启':'环境音已关闭');
}
