name: Deploy leaderboard

# Publishes the static leaderboard from leaderboard/ to GitHub Pages.
# Enable once in Settings -> Pages -> Source: "GitHub Actions".
# All served result cells are PLACEHOLDER until scripts/reproduce_main_table.py
# generates real rows from committed traces.

on:
  push:
    branches: [main]
    paths:
      - 'leaderboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard
      - id: deployment
        uses: actions/deploy-pages@v4
