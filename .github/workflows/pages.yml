name: Deploy site (leaderboard + task catalog + results board)

# Publishes the static leaderboard at the site root, the 180-task catalogue
# under /catalog/, and the per-task results board under /results/.
# Source files live in their own folders in the
# repo (leaderboard/, docs/, tasks/) and are assembled into a staging
# directory here, so there is exactly one copy of each file to maintain.
# Enable once in Settings -> Pages -> Source: "GitHub Actions".
# All served result cells are PLACEHOLDER until scripts/reproduce_main_table.py
# generates real rows from committed traces.

on:
  push:
    branches: [main]
    paths:
      - 'leaderboard/**'
      - 'docs/task-catalog.*'
      - 'docs/results-dashboard.html'
      - 'results/**'
      - 'tasks/taxonomy.json'
      - 'scripts/build_catalog.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site/catalog
          # Site root stays the leaderboard (unchanged URLs).
          cp -R leaderboard/. site/
          # /catalog/ — self-contained interactive table + downloadable data.
          cp docs/task-catalog.html  site/catalog/index.html
          cp docs/task-catalog.html  site/catalog/task-catalog.html
          cp docs/task-catalog.csv   site/catalog/task-catalog.csv
          cp docs/task-catalog.md    site/catalog/task-catalog.md
          cp tasks/taxonomy.json     site/catalog/taxonomy.json
          # /results/ — self-contained per-task evidence board (artifacts inlined).
          mkdir -p site/results
          cp docs/results-dashboard.html site/results/index.html
          # Bypass Jekyll so .json/.csv and the underscore-free files serve as-is.
          touch site/.nojekyll
          echo "Assembled site:"
          find site -maxdepth 2 -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
